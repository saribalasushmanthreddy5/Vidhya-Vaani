[theme]
base = "dark"
primaryColor = "#8B5CF6"
backgroundColor = "#030303"
secondaryBackgroundColor = "#0A0A0A"
textColor = "#EDEDED"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
